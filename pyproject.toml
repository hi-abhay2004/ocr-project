[project]
name = "answer-sheet-evaluation"
version = "0.1.0"
description = "AI-Driven Automated Answer Sheet Evaluation System"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "django-filter>=24.3",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26,<2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "pillow>=10.4",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "openai>=1.50",
    "httpx>=0.27",
    "google-genai>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "black>=24.8",
    "pre-commit>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "apps", "ai", "scripts"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
(
    /migrations/
    | \.venv/
    | frontend/
    | media/
    | media_test/
    | staticfiles/
    | datasets/
)
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "migrations",
    ".venv",
    "frontend",
    "media",
    "media_test",
    "staticfiles",
    "datasets",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
markers = [
    "slow: needs downloaded datasets or a real network provider (deselected by default)",
]
addopts = "-m 'not slow'"
